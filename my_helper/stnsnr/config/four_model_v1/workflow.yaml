profile_type: dual_frequency_workflow # Identifies the configured runner workflow.

model_profiles: # Scientific profiles resolved relative to this file.
  direct_voxel: direct_voxel_model.yaml # Reference/add-on direct-voxel contract.
  normative_fiber: normative_fiber_model.yaml # Reference/add-on fiber contract.
  individualized_seed_target: individualized_seed_target_model.yaml # Reference/add-on patient-specific target contract.

output: # Single formal result root shared by all model domains.
  root: /Volumes/VAL/STNSNr/summary/spot

selection: # Defaults may select model domains, but never clinical scales.
  models: [all] # Run all configured model families unless CLI narrows the set.
  connectomes: [all] # Use every connectome declared by the fiber profile.

execution: # Runtime controls do not change the scientific model definition.
  through: report # Dependency-complete cutoff: observed, formal, sensitivity, or report.
  resume: false # A run resumes only when the CLI explicitly requests it.
  force: false # Explicit force overwrites the requested run root at the same path.
  continue_on_endpoint_failure: true # One failed scale does not stop independent scales.
  allow_expensive_producers: false # OSS and other expensive cache misses require opt-in.
  workers: 3 # Default endpoint-level worker count; CLI may override it later.

storage: # Generic cache and immutable run-store roots.
  cache_root: /Volumes/VAL/STNSNr/cache/dual_frequency
  run_root: /Volumes/VAL/STNSNr/summary/spot/.runs
  delete_run_cache_on_success: false # Retain cache; failed or partial runs are never cleanup-eligible.
