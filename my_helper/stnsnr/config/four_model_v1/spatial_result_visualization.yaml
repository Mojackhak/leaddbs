background:
  path: /Volumes/VAL/STNSNr/config/atlas/7T_100um_Edlow_2019.nii
  loading: panel_local_lazy

display_map:
  fwhm_mm: 1.0
  voxel_size_mm: 0.1
  support_weight_threshold: 0.5

outline:
  continuous_isovalue: 0.05

surface:
  inward_sampling_depth_mm: 0.25

voxel:
  masks:
    reference: /Users/mojackhu/Github/leaddbs/templates/space/MNI152NLin2009bAsym/atlases/Custom_Ewert_Zhang_Middlebrooks/rh/STN.nii.gz
    addon: /Users/mojackhu/Github/leaddbs/templates/space/MNI152NLin2009bAsym/atlases/Custom_Ewert_Zhang_Middlebrooks/rh/SNr.nii.gz
  labels:
    colorbar_template: "Benefit-oriented partial Spearman ρ with {scale_display_name}"

fiber:
  projection:
    grid_source: role_seed
    direct_streamline_scope: selected_sweet_sour_complete_path
    primary_target_score_fiber_scope: final_resolver_valid_fiber_axis
    individualized_target_score_fiber_scope: role_seed_connected_with_target_hit
    sensitivity_target_score_fiber_scope: selected_sweet_sour
    voxel_composition_fiber_scope: formal_connectome_all
    target_conditioned_scope: seed_only
    per_fiber_per_voxel: once
    target_hit_method: segment_intersection
    target_membership: independent_binary
    streamline_target_score: equal_mean_over_finite_target_scores
    target_composition: seed_voxel_target_pattern_counts
    streamline_weight_source: uniform_one
    missing_target_score_policy: exclude_target_then_renormalize_per_streamline
    no_scored_target_policy: exclude_and_report

  cache:
    physical_cache_kind: whole_connectome_seed_voxel_target_patterns
    fiber_chunk_size: 20000

  labels:
    direct_streamline_colorbar_template: "Mean selected-fiber partial Spearman ρ with {scale_display_name}"
    target_conditioned_colorbar_template: "Target-derived fiber partial Spearman ρ with {scale_display_name}"

  target_chart:
    order_policy: configured_target_catalog
    bootstrap_interval_percentiles: [2.5, 97.5]
    fold_selection_definition: stable_finite_training_fold

  color_limits:
    center: 0.0
    scope: scale_role
    symmetric: true

  individualized_seed_target:
    projection_connectome_id: ppmi_85_ewert_2017
    projection_connectome_path: /Users/mojackhu/Github/leaddbs/connectomes/dMRI/PPMI 85 (Ewert 2017)/data.mat
    coefficient_source: final_benefit_oriented_partial_spearman
    shared_projection_kind: target_projections

